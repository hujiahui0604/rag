version: '3.8'

services:
  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: erag-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend-static:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend
    networks:
      - erag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erag-frontend
    env_file:
      - ./frontend/.env.production
    environment:
      - NODE_ENV=production
    volumes:
      - frontend-static:/app/build
      - /app/node_modules
    networks:
      - erag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-f", "/app/build/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erag-backend
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:///./data/db/rag.db
      - CHROMA_PATH=/app/data/chroma
      - DATA_PATH=/app/data/documents
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./data:/app/data
      - ollama-models:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - erag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama 本地大模型
  ollama:
    image: ollama/ollama:latest
    container_name: erag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - erag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: '8'
        reservations:
          memory: 4G
          cpus: '2'

networks:
  erag-network:
    driver: bridge

volumes:
  frontend-static:
  ollama-models: